[tool.poetry]
name = "server"
version = "0.0.0"
description = "Server"
authors = ["Dallan Quass <dallan@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/DallanQ/server"
repository = "https://github.com/DallanQ/server"
documentation = "https://server.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
]

[tool.poetry.urls]
Changelog = "https://github.com/DallanQ/server/releases"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.142.2"
mangum = "^0.22.0"
openai = "^2.54.0"
pinecone = "^10.0.0"
python-dotenv = "^1.2.1"
python-json-logger = "^4.2.0"
upstash-ratelimit = "^1.2.0"
upstash-redis = "^1.8.0"

[tool.poetry.group.dev.dependencies]
Pygments = ">=2.10.0"
black = ">=24.3.0"
boto3 = ">=1.34.0"
boto3-stubs = {extras = ["ssm"], version = ">=1.34.0"}
coverage = {extras = ["toml"], version = ">=6.2"}
darglint = ">=1.8.1"
flake8 = ">=6.0.0"
flake8-bandit = ">=2.1.2"
flake8-bugbear = ">=21.9.2"
flake8-docstrings = ">=1.6.0"
flake8-rst-docstrings = ">=0.2.5"
furo = ">=2021.11.12"
isort = ">=5.10.1"
mypy = ">=0.930"
pep8-naming = ">=0.12.1"
pre-commit = ">=2.16.0"
pre-commit-hooks = ">=4.1.0"
pytest = ">=6.2.5"
pyupgrade = ">=3.3.1"
safety = ">=1.10.3"
sphinx = ">=4.3.2"
sphinx-autobuild = ">=2021.3.14"
typeguard = ">=4.0.0"
myst-parser = {version = ">=0.16.1"}
uvicorn = {extras = ["standard"], version = ">=0.20.0"}
markdownify = "^0.11.6"
beautifulsoup4 = "^4.11.2"
requests = "^2.28.2"

[tool.coverage.paths]
source = ["server", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["server", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.isort]
profile = "black"
force_single_line = true

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
