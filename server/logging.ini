[loggers]
keys = root, server

[handlers]
keys = consoleHandler

[formatters]
keys = json

[logger_root]
level = INFO
handlers = consoleHandler

# Named here so fileConfig never disables it, whatever the import order. The log archive's
# subscription filter matches on this name ($.name = "server.main").
[logger_server]
level = INFO
handlers =
qualname = server.main
propagate = 1

[handler_consoleHandler]
class = StreamHandler
level = INFO
formatter = json
args = (sys.stdout,)

[formatter_json]
class = pythonjsonlogger.json.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(message)s
